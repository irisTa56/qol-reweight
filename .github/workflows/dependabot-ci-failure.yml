name: Dependabot CI failure

# Fail when an open Dependabot PR has a check that ended other than in success,
# so that the failure reaches the repository owner. GitHub notifies a user of
# the workflow runs they triggered and of no other, and Dependabot triggers
# the CI runs of its own PRs, so a failing update otherwise sits open, its
# auto-merge waiting, and nobody is told. A scheduled run is notified to the
# user who last changed its `cron` line, as link-check-weekly.yml relies on, so
# the failure of this one reaches the owner.
#
# It looks only at open PRs. A Dependabot PR whose failed check is not one the
# main ruleset requires merges anyway, so it is gone by the time this runs; one
# that stays open is one whose merge is held up.
#
# A check still running is not counted, so a check that never ends is caught
# only once the job's timeout ends it. GitHub disables a `schedule` trigger
# after 60 days with no repository activity, as ci.yml's own comment says, and
# this check goes quiet with it.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Enough to list PRs and read their checks, and nothing to write.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  failed-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on an open Dependabot PR with a failed check
        run: |
          failed=$(gh pr list --repo "$REPO" --author app/dependabot --state open \
            --json url,statusCheckRollup \
            --jq '.[] | select(any(.statusCheckRollup[];
              (.__typename == "CheckRun" and .status == "COMPLETED"
                and (.conclusion | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))
              or (.__typename == "StatusContext" and (.state | IN("FAILURE", "ERROR")))))
              | .url')
          if [ -n "$failed" ]; then
            echo "::error::An open Dependabot PR has a failed check:"
            echo "$failed"
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
