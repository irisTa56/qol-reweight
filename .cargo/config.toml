# Dependency cooldown: when cargo resolves a version that `Cargo.lock` does
# not already hold, as `cargo update` and `cargo add` do, it passes over one
# published to crates.io within the last day, so a release that is compromised
# or broken, and pulled within hours, has gone before it gets here. A day, as
# mise waits by default for the tools it installs. A version without a publish
# time in the index is not held back.
# https://doc.rust-lang.org/cargo/reference/config.html#registryglobal-min-publish-age
#
# What `Cargo.lock` already holds stays, so `--locked` never fails on this, and
# a version Dependabot writes there is held back by Dependabot's own cooldown,
# 3 days by default, instead. A cargo older than 1.100 ignores the key and says
# so.
[registry]
global-min-publish-age = "1 day"
