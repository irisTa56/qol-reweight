# BeautifulRust's `lints/clippy.toml`, its settings taken whole; the lints in
# Cargo.toml say how its changes upstream are watched and taken.
# upstream: git::https://github.com/morganlinton/BeautifulRust.git//lints/clippy.toml?ref=b9718436d77ee7bcf17cdcb6aa27628feb95d97a

# Flag any function with a bool parameter, not just functions with four or more.
# A bool argument is unreadable at the call site (report(true)) and can't grow a
# third mode; use a two-variant enum or two methods instead.
max-fn-params-bools = 0

# Allow unwrap, expect, and printing in tests, where a panic is the assertion.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
