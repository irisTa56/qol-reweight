[package]
name = "qol-reweight"
version = "0.1.0"
edition = "2024"
license = "MIT"
# A local tool, built from this repository and never released as a crate.
publish = false

[dependencies]
colorous = "1.0.16"
csv = "1.4.0"
# Four of the default features, and not the others: those that serve the
# web, and `x11` and `wayland`, which a Linux build does without.
# - `accesskit`: tells a screen reader what the window holds. On Linux its
#   `accesskit_winit` has winit built for X11 and for Wayland both, one of
#   which winit needs there.
# - `default_fonts`: egui's own fonts, which draw what the Japanese font lacks
# - `links`: opens a link in the browser when it is clicked
# - `wgpu`: draws the window
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "wgpu",
] }
# What reads the fonts installed on the system, and not `fontconfig`, which
# reads where Linux says its fonts are: the font looked for is one macOS has.
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
thiserror = "2.0.21"
unit-prefix = "0.5.2"
walkers = "0.65.0"

[dev-dependencies]
# `std` alone: it holds the strategies the tests use, text from a pattern among
# them. The other default features run a case in a child process (`fork`) or
# under a time limit (`timeout`), or make bit sets (`bit-set`); no test here
# needs them, and each brings crates of its own.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# For macOS alone, as the tests that drive the window are: elsewhere the tool
# has no font to state the map's sources in, and shows no map.
[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest = "0.37.0"

# The lints from BeautifulRust's `lints/lints.toml`, less those it marks as
# fitting a library only, with `clippy.toml` beside this file taken whole.
# `upstream:pin-check` says when the upstream files change at this pin; what
# changes there is taken by hand, since `-D warnings` in `qa:rust:clippy`
# would turn any lint added upstream into a failed commit.
# upstream: git::https://github.com/morganlinton/BeautifulRust.git//lints/lints.toml?ref=b9718436d77ee7bcf17cdcb6aa27628feb95d97a
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
# Off by default. `qa:rust:clippy` denies warnings, so what the lint reports
# fails the check: a `pub` item in a private module, though not a `pub` field of
# a `pub(crate)` struct, nor an item of the crate root.
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

# A crate in `[dependencies]` that the code never uses. `deny` rather than the
# default `warn`: this is a lint of cargo's, not of rustc's, so `-D warnings`
# in `qa:rust:clippy` leaves it a warning that passes. It does not look at
# `[dev-dependencies]`, nor at a crate another dependency also depends on, such
# as `thiserror`, which cargo takes for one named to set its version or
# features (rust-lang/cargo#16935). A cargo older than 1.100 ignores the table
# and says so.
# https://doc.rust-lang.org/cargo/reference/lints.html#unused_dependencies
[lints.cargo]
unused_dependencies = "deny"
