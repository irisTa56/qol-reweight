[package]
name = "qol-reweight"
version = "0.1.0"
edition = "2024"
license = "MIT"
# A local tool, built from this repository and never released as a crate.
publish = false

[dependencies]
colorous = "1.0.16"
csv = "1.4.0"
thiserror = "2.0.21"

[dev-dependencies]
# `std` alone: it holds the strategies the tests use, text from a pattern among
# them. The other default features run a case in a child process (`fork`) or
# under a time limit (`timeout`), or make bit sets (`bit-set`); no test here
# needs them, and each brings crates of its own.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
