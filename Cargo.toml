[package]
name = "qol-reweight"
version = "0.1.0"
edition = "2024"
license = "MIT"
# A local tool, built from this repository and never released as a crate.
publish = false

[dependencies]
colorous = "1.0.16"
csv = "1.4.0"
# Four of the default features, and not the others, which serve a screen
# reader, the web, and Wayland:
# - `default_fonts`: egui's own fonts, which draw the text that is not Japanese
# - `links`: opens a link in the browser when it is clicked
# - `wgpu`: draws the window
# - `x11`: Linux builds with it or with `wayland` and with neither fails, and
#   CI builds there, though the tool is checked on macOS only
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "links",
    "wgpu",
    "x11",
] }
# What reads the fonts installed on the system, and not `fontconfig`, which
# reads where Linux says its fonts are: the font looked for is one macOS has.
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
thiserror = "2.0.21"
walkers = "0.60.0"

[dev-dependencies]
# `std` alone: it holds the strategies the tests use, text from a pattern among
# them. The other default features run a case in a child process (`fork`) or
# under a time limit (`timeout`), or make bit sets (`bit-set`); no test here
# needs them, and each brings crates of its own.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# For macOS alone, as the tests that drive the window are: elsewhere the tool
# has no font to state the map's sources in, and shows no map.
[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest = "0.36.2"

# Off by default. `qa:rust:clippy` denies warnings, so what the lint reports
# fails the check: a `pub` item in a private module, though not a `pub` field of
# a `pub(crate)` struct, nor an item of the crate root.
[lints.rust]
unreachable_pub = "warn"
