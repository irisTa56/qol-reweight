[package]
name = "qol-reweight"
version = "0.1.0"
edition = "2024"
license = "MIT"
# A local tool, built from this repository and never released as a crate.
publish = false

[dependencies]
csv = "1.4.0"
thiserror = "2.0.21"

[dev-dependencies]
# `std` alone: it holds the strategies the tests use, text from a pattern among
# them. The other default features run a case in a child process (`fork`) or
# under a time limit (`timeout`), or make bit sets (`bit-set`); no test here
# needs them, and each brings crates of its own.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# Off by default. `qa:rust:clippy` denies warnings, so what the lint reports
# fails the check: a `pub` item in a private module, though not a `pub` field of
# a `pub(crate)` struct, nor an item of the crate root.
[lints.rust]
unreachable_pub = "warn"
